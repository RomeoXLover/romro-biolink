<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>romro | Bio Link</title>
  <meta name="description" content="ROMRO - Custom aesthetic bio-link profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #050519;
      --bg-surface: rgba(14, 14, 35, 0.72);
      --primary: #7B5CF8;
      --primary-rgb: 123, 92, 248;
      --secondary: #9E86FB;
      --accent-glow: rgba(123, 92, 248, 0.45);
      --accent-glow-strong: rgba(123, 92, 248, 0.75);
      --border-color: rgba(123, 92, 248, 0.22);
      --border-color-hover: rgba(123, 92, 248, 0.55);
      --text-main: #FFFFFF;
      --text-muted: #9499B7;
      --card-blur: 16px;
      --card-opacity: 0.72;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Space Grotesk', sans-serif;
    }

    /* THEMES */
    body[data-theme="blurple"] {
      --primary: #7B5CF8;
      --primary-rgb: 123, 92, 248;
      --secondary: #A78BFA;
      --accent-glow: rgba(123, 92, 248, 0.45);
      --accent-glow-strong: rgba(123, 92, 248, 0.75);
      --border-color: rgba(123, 92, 248, 0.25);
      --border-color-hover: rgba(123, 92, 248, 0.65);
    }

    body[data-theme="crimson"] {
      --primary: #EF4444;
      --primary-rgb: 239, 68, 68;
      --secondary: #F87171;
      --accent-glow: rgba(239, 68, 68, 0.45);
      --accent-glow-strong: rgba(239, 68, 68, 0.75);
      --border-color: rgba(239, 68, 68, 0.25);
      --border-color-hover: rgba(239, 68, 68, 0.65);
    }

    body[data-theme="emerald"] {
      --primary: #10B981;
      --primary-rgb: 16, 185, 129;
      --secondary: #34D399;
      --accent-glow: rgba(16, 185, 129, 0.45);
      --accent-glow-strong: rgba(16, 185, 129, 0.75);
      --border-color: rgba(16, 185, 129, 0.25);
      --border-color-hover: rgba(16, 185, 129, 0.65);
    }

    body[data-theme="amber"] {
      --primary: #F59E0B;
      --primary-rgb: 245, 158, 11;
      --secondary: #FBBF24;
      --accent-glow: rgba(245, 158, 11, 0.45);
      --accent-glow-strong: rgba(245, 158, 11, 0.75);
      --border-color: rgba(245, 158, 11, 0.25);
      --border-color-hover: rgba(245, 158, 11, 0.65);
    }

    body[data-theme="ocean"] {
      --primary: #06B6D4;
      --primary-rgb: 6, 182, 212;
      --secondary: #38BDF8;
      --accent-glow: rgba(6, 182, 212, 0.45);
      --accent-glow-strong: rgba(6, 182, 212, 0.75);
      --border-color: rgba(6, 182, 212, 0.25);
      --border-color-hover: rgba(6, 182, 212, 0.65);
    }

    body[data-theme="rose"] {
      --primary: #F43F5E;
      --primary-rgb: 244, 63, 94;
      --secondary: #FB7185;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --accent-glow-strong: rgba(244, 63, 94, 0.75);
      --border-color: rgba(244, 63, 94, 0.25);
      --border-color-hover: rgba(244, 63, 94, 0.65);
    }

    body[data-theme="void"] {
      --primary: #94A3B8;
      --primary-rgb: 148, 163, 184;
      --secondary: #CBD5E1;
      --accent-glow: rgba(148, 163, 184, 0.25);
      --accent-glow-strong: rgba(148, 163, 184, 0.45);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-color-hover: rgba(255, 255, 255, 0.35);
    }

    body[data-theme="retro"] {
      --primary: #EC4899;
      --primary-rgb: 236, 72, 153;
      --secondary: #06B6D4;
      --accent-glow: rgba(236, 72, 153, 0.55);
      --accent-glow-strong: rgba(6, 182, 212, 0.75);
      --border-color: rgba(236, 72, 153, 0.35);
      --border-color-hover: rgba(6, 182, 212, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Custom Cursor */
    body.cursor-dot {
      cursor: none;
    }
    body.cursor-crosshair {
      cursor: crosshair;
    }
    #custom-cursor-dot {
      display: none;
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
      transition: width 0.15s ease, height 0.15s ease, background-color 0.2s ease;
    }
    #custom-cursor-follower {
      display: none;
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out, border-color 0.2s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(5, 5, 25, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    /* Background Elements */
    #bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: background 0.5s ease;
    }
    #bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: none;
    }
    #bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 25, 0.65);
      backdrop-filter: blur(2px);
    }
    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Animated Gradient Background */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animated-gradient {
      background-size: 300% 300% !important;
      animation: gradientShift 18s ease infinite;
    }

    /* Click to Enter Overlay (Guns.lol style) */
    #enter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 25, 0.94);
      backdrop-filter: blur(25px);
      z-index: 9000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }
    #enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .enter-prompt {
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: pulseText 2s ease-in-out infinite;
    }
    .enter-prompt .pulse-dot {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--primary);
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.55; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* Main Container & Layout */
    .app-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem 4rem;
      perspective: 1200px;
    }

    /* Top Nav Quick Controls */
    .top-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      background: rgba(14, 14, 35, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .nav-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }
    .nav-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Theme Selector Dropdown */
    .theme-dropdown {
      position: relative;
    }
    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(14, 14, 35, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px;
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 220px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 101;
    }
    .theme-menu.active {
      display: grid;
    }
    .theme-opt {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      background: transparent;
      border: none;
      color: #CCC;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .theme-opt:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFF;
    }
    .theme-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Profile Card 3D Container */
    .card-tilt-container {
      width: 100%;
      max-width: 520px;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* Main Glass Card */
    .profile-card {
      position: relative;
      background: var(--bg-surface);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 2.5rem 2rem 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 35px var(--accent-glow);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }
    .profile-card::before {
      content: '';
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.75;
      z-index: 0;
    }
    .profile-card:hover {
      border-color: var(--border-color-hover);
      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.75), 0 0 45px var(--accent-glow-strong);
    }

    .card-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 1.4rem;
    }
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2.5px solid var(--primary);
      box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(0,0,0,0.5);
      background: #090919;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.05) rotate(3deg);
    }
    .status-indicator {
      position: absolute;
      bottom: 4px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3.5px solid #0b0b1f;
      background-color: #10B981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
    }
    .status-indicator.online { background-color: #10B981; box-shadow: 0 0 10px #10B981; }
    .status-indicator.idle { background-color: #F59E0B; box-shadow: 0 0 10px #F59E0B; }
    .status-indicator.dnd { background-color: #EF4444; box-shadow: 0 0 10px #EF4444; }
    .status-indicator.offline { background-color: #64748B; box-shadow: 0 0 10px #64748B; }

    /* Badges */
    .badges-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .badge-tag {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .badge-tag:hover {
      transform: translateY(-2px);
    }

    /* Username & Effects */
    .username-wrapper {
      margin-bottom: 0.6rem;
      position: relative;
      display: inline-block;
    }
    .profile-username {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: #FFFFFF;
      position: relative;
    }

    /* Username effect: gradient */
    .profile-username.effect-gradient {
      background: linear-gradient(135deg, #FFFFFF 20%, var(--primary) 70%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px var(--accent-glow));
    }

    /* Username effect: rainbow */
    @keyframes rainbowShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    .profile-username.effect-rainbow {
      background: linear-gradient(90deg, #ff0055, #ff9900, #33cc33, #00ccff, #9933ff, #ff0055);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
    }

    /* Username effect: glitch */
    .profile-username.effect-glitch {
      position: relative;
      color: #fff;
    }
    .profile-username.effect-glitch::before,
    .profile-username.effect-glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }
    .profile-username.effect-glitch::before {
      left: -2px;
      text-shadow: 2px 0 #EF4444;
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .profile-username.effect-glitch::after {
      left: 2px;
      text-shadow: -2px 0 #06B6D4;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim-1 {
      0% { clip: rect(20px, 9999px, 40px, 0); }
      20% { clip: rect(60px, 9999px, 80px, 0); }
      40% { clip: rect(10px, 9999px, 30px, 0); }
      60% { clip: rect(70px, 9999px, 90px, 0); }
      80% { clip: rect(40px, 9999px, 60px, 0); }
      100% { clip: rect(5px, 9999px, 25px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 70px, 0); }
      20% { clip: rect(15px, 9999px, 35px, 0); }
      40% { clip: rect(80px, 9999px, 100px, 0); }
      60% { clip: rect(30px, 9999px, 50px, 0); }
      80% { clip: rect(65px, 9999px, 85px, 0); }
      100% { clip: rect(25px, 9999px, 45px, 0); }
    }

    /* Username effect: typewriter cursor */
    .profile-username.effect-typewriter::after {
      content: '|';
      color: var(--primary);
      animation: blinkCursor 0.9s infinite;
      margin-left: 2px;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bio */
    .profile-bio {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 90%;
      margin-bottom: 1.5rem;
    }

    /* View Counter Badge */
    .view-counter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .view-counter svg {
      width: 14px;
      height: 14px;
      fill: var(--primary);
    }
    .view-count-number {
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Socials Grid */
    .socials-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 1.6rem;
    }
    @media (max-width: 440px) {
      .socials-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .social-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
    }
    .social-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.25s ease, fill 0.25s ease;
    }
    .social-btn span {
      font-size: 0.68rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
    }
    .social-btn:hover {
      background: rgba(var(--primary-rgb), 0.12);
      border-color: var(--primary);
      color: #FFFFFF;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px -4px var(--accent-glow);
    }
    .social-btn:hover svg {
      transform: scale(1.15);
      fill: var(--primary);
    }

    /* Audio Player Component */
    .audio-player-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s ease;
    }
    .audio-player-card:hover {
      border-color: var(--border-color-hover);
    }
    .audio-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .audio-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      overflow: hidden;
    }
    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: transform 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }
    .play-btn:hover {
      transform: scale(1.08);
      background: var(--secondary);
    }
    .play-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .song-details {
      overflow: hidden;
    }
    .song-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Audio visualizer bars */
    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .audio-visualizer .bar {
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
      height: 4px;
      transition: height 0.15s ease;
    }
    .audio-visualizer.playing .bar:nth-child(1) { animation: bounce 0.8s ease-in-out infinite alternate; }
    .audio-visualizer.playing .bar:nth-child(2) { animation: bounce 1.1s ease-in-out infinite alternate 0.2s; }
    .audio-visualizer.playing .bar:nth-child(3) { animation: bounce 0.9s ease-in-out infinite alternate 0.4s; }
    .audio-visualizer.playing .bar:nth-child(4) { animation: bounce 1.2s ease-in-out infinite alternate 0.1s; }
    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 18px; }
    }
    /* Audio progress bar */
    .audio-controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar-container {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      position: relative;
    }
    .time-display {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .volume-slider {
      width: 65px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Discord Presence Card */
    .discord-card {
      width: 100%;
      background: rgba(10, 10, 26, 0.45);
      border: 1px solid rgba(88, 101, 242, 0.25);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 1.5rem;
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s ease;
    }
    .discord-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }
    .discord-card:hover {
      border-color: rgba(88, 101, 242, 0.6);
    }
    .discord-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .discord-avatar-wrap img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #111;
      border: 1.5px solid rgba(88, 101, 242, 0.4);
    }
    .discord-status-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid #090919;
    }
    .discord-meta {
      flex: 1;
      overflow: hidden;
    }
    .discord-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .discord-username {
      font-size: 0.88rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-badge {
      font-size: 0.65rem;
      background: #5865F2;
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .discord-activity {
      font-size: 0.78rem;
      color: #A3A8CA;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-details {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-time {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--primary);
      margin-top: 2px;
    }

    /* About Me Box */
    .about-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 0.8rem;
    }
    .about-box-title {
      font-size: 0.82rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .about-box-content {
      font-size: 0.85rem;
      color: #C1C6E2;
      line-height: 1.6;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 6px;
      white-space: pre-wrap;
    }

    /* Footer */
    .profile-footer {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .profile-footer a:hover {
      color: var(--secondary);
      text-decoration: underline;
    }
  </style>
</head>

      // Theme Picker Logic
      const themeBtn = document.getElementById('theme-btn');
      const themeMenu = document.getElementById('theme-menu');
      if (themeBtn && themeMenu) {
        themeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          themeMenu.classList.toggle('active');
        });
        document.addEventListener('click', () => themeMenu.classList.remove('active'));
        themeMenu.querySelectorAll('.theme-opt').forEach(opt => {
          opt.addEventListener('click', (e) => {
            const chosen = opt.getAttribute('data-theme-val');
            document.body.setAttribute('data-theme', chosen);
            config.theme = chosen;
            try {
              localStorage.setItem('romro_custom_config', JSON.stringify(config));
            } catch(e){}
            themeMenu.classList.remove('active');
          });
        });
      }

      // 3. Setup Custom Cursor
      const cursorDot = document.getElementById('custom-cursor-dot');
      const cursorFollower = document.getElementById('custom-cursor-follower');
      const cursorType = (config.effects && config.effects.customCursor) || "crosshair";

      if (cursorType === "dot" || cursorType === "crosshair") {
        if (cursorType === "dot") {
          document.body.classList.add('cursor-dot');
          cursorDot.style.display = 'block';
          cursorFollower.style.display = 'block';
        } else {
          document.body.classList.add('cursor-crosshair');
        }

        window.addEventListener('mousemove', (e) => {
          if (cursorType === "dot") {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            setTimeout(() => {
              cursorFollower.style.left = e.clientX + 'px';
              cursorFollower.style.top = e.clientY + 'px';
            }, 40);
          }
        });
      }

      // 4. Background Setup (Gradient, Solid, Image, Video)
      const bgLayer = document.getElementById('bg-layer');
      const bgVideo = document.getElementById('bg-video');
      const bgOverlay = document.getElementById('bg-overlay');
      const bgConf = config.background || {};

      if (bgConf.overlayOpacity !== undefined) {
        bgOverlay.style.background = `rgba(5, 5, 25, ${bgConf.overlayOpacity})`;
      }

      if (bgConf.type === "video" && bgConf.videoUrl) {
        bgVideo.src = bgConf.videoUrl;
        bgVideo.style.display = 'block';
      } else if (bgConf.type === "image" && bgConf.imageUrl) {
        bgLayer.style.backgroundImage = `url('${bgConf.imageUrl}')`;
      } else if (bgConf.type === "solid") {
        bgLayer.style.backgroundColor = bgConf.solidColor || '#050519';
      } else {
        // Gradient
        const colors = bgConf.gradientColors || ["#050519", "#0c0827", "#120a3a", "#050519"];
        const angle = bgConf.gradientAngle || 135;
        bgLayer.style.background = `linear-gradient(${angle}deg, ${colors.join(', ')})`;
        if (bgConf.animatedGradient) {
          bgLayer.classList.add('animated-gradient');
        }
      }

      // 5. Card Opacity & Blur Controls
      const profileCard = document.getElementById('profile-card');
      const cardBlur = (config.effects && config.effects.cardBlur !== undefined) ? config.effects.cardBlur : 16;
      const cardOpacity = (config.effects && config.effects.cardOpacity !== undefined) ? config.effects.cardOpacity : 0.72;
      document.documentElement.style.setProperty('--card-blur', `${cardBlur}px`);
      document.documentElement.style.setProperty('--card-opacity', `${cardOpacity}`);
      profileCard.style.backgroundColor = `rgba(14, 14, 35, ${cardOpacity})`;

      // 6. Profile Avatar, Username & Bio
      const avatarImg = document.getElementById('avatar-img');
      avatarImg.src = config.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed=romro";
      
      const usernameEl = document.getElementById('profile-username');
      const uname = config.displayName || config.username || "romro";
      usernameEl.textContent = uname;
      usernameEl.setAttribute('data-text', uname);

      // Username Text Effect
      const effect = (config.effects && config.effects.usernameEffect) || "gradient";
      usernameEl.className = `profile-username effect-${effect}`;
      
      if (effect === "typewriter") {
        let i = 0;
        let isDeleting = false;
        const speed = 120;
        const pause = 2000;
        function typeLoop() {
          const current = isDeleting ? uname.substring(0, i--) : uname.substring(0, i++);
          usernameEl.textContent = current;
          if (!isDeleting && i > uname.length) {
            isDeleting = true;
            setTimeout(typeLoop, pause);
          } else if (isDeleting && i < 0) {
            isDeleting = false;
            i = 0;
            setTimeout(typeLoop, 500);
          } else {
            setTimeout(typeLoop, isDeleting ? speed / 2 : speed);
          }
        }
        typeLoop();
      }

      const bioEl = document.getElementById('profile-bio');
      bioEl.textContent = config.bio || "";

      // 7. Badges System
      const badgesContainer = document.getElementById('badges-container');
      badgesContainer.innerHTML = '';
      if (Array.isArray(config.badges)) {
        config.badges.forEach(b => {
          const badge = document.createElement('div');
          badge.className = 'badge-tag';
          badge.textContent = b.text;
          badge.style.backgroundColor = b.color || 'var(--primary)';
          badge.style.color = b.textColor || '#FFFFFF';
          badge.style.boxShadow = `0 0 12px ${b.glow || 'rgba(123, 92, 248, 0.4)'}`;
          badgesContainer.appendChild(badge);
        });
      }

      // 8. View Counter
      const viewsConf = config.views || { enabled: true, initialCount: 1337 };
      const viewCounterWrap = document.getElementById('view-counter-container');
      if (viewsConf.enabled) {
        let count = parseInt(localStorage.getItem('romro_views') || viewsConf.initialCount || 1337, 10);
        count += 1;
        localStorage.setItem('romro_views', count);
        document.getElementById('view-count-number').textContent = count.toLocaleString();
        document.getElementById('view-count-label').textContent = viewsConf.label || "views";
      } else {
        viewCounterWrap.style.display = 'none';
      }

      // 9. Socials Grid
      const socialsGrid = document.getElementById('socials-grid');
      socialsGrid.innerHTML = '';
      if (Array.isArray(config.socials)) {
        config.socials.forEach(s => {
          const a = document.createElement('a');
          a.className = 'social-btn';
          a.href = s.url || '#';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = `${s.label} (${s.handle || ''})`;
          
          const iconSvg = SOCIAL_ICONS[s.platform.toLowerCase()] || '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>';
          a.innerHTML = `${iconSvg}<span>${s.label || s.platform}</span>`;
          socialsGrid.appendChild(a);
        });
      }

      // 10. Discord Presence Card
      const discordConf = config.discord || { enabled: true };
      const discordCard = document.getElementById('discord-card');
      if (discordConf.enabled) {
        document.getElementById('discord-user').textContent = discordConf.username || "romro#1337";
        document.getElementById('discord-avatar').src = discordConf.avatar || "https://api.dicebear.com/7.x/bottts/svg?seed=romro-bot";
        
        const dot = document.getElementById('discord-status-dot');
        dot.className = `discord-status-dot ${discordConf.status || 'online'}`;
        
        const avatarDot = document.getElementById('avatar-status');
        avatarDot.className = `status-indicator ${discordConf.status || 'online'}`;

        document.getElementById('discord-activity-line').textContent = `${discordConf.activityType || 'Playing'} ${discordConf.activityName || 'Visual Studio Code'}`;
        document.getElementById('discord-details-line').textContent = discordConf.details || "Developing ROMRO Bio-Link Platform";
        
        // Live elapsed timer
        let secondsElapsed = 260; // 04:20
        const timeLine = document.getElementById('discord-time-line');
        setInterval(() => {
          secondsElapsed++;
          const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
          const secs = (secondsElapsed % 60).toString().padStart(2, '0');
          timeLine.textContent = `${mins}:${secs} elapsed`;
        }, 1000);
      } else {
        discordCard.style.display = 'none';
      }

      // 11. About Me Box
      const aboutConf = config.aboutMe || { enabled: true };
      const aboutBox = document.getElementById('about-box');
      if (aboutConf.enabled) {
        document.getElementById('about-box-title').textContent = aboutConf.title || "About Me";
        document.getElementById('about-box-content').textContent = aboutConf.content || "";
      } else {
        aboutBox.style.display = 'none';
      }

      // 12. Audio Player Logic
      const audioConf = config.audio || { enabled: true };
      const audioCard = document.getElementById('audio-player-card');
      const audioElement = document.getElementById('bg-audio');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const visualizer = document.getElementById('audio-visualizer');
      const songTitle = document.getElementById('song-title');
      const songArtist = document.getElementById('song-artist');
      const progressFill = document.getElementById('audio-progress-fill');
      const progressContainer = document.getElementById('audio-progress-container');
      const currentTimeEl = document.getElementById('audio-current-time');
      const durationEl = document.getElementById('audio-duration');
      const volumeSlider = document.getElementById('audio-volume');

      let isPlaying = false;

      if (audioConf.enabled) {
        audioElement.src = audioConf.audioUrl || "https://cdn.freesound.org/previews/612/612613_5674468-lq.mp3";
        audioElement.volume = audioConf.volume !== undefined ? audioConf.volume : 0.65;
        volumeSlider.value = audioElement.volume;
        songTitle.textContent = audioConf.title || "Lofi Chill - romro's playlist";
        songArtist.textContent = audioConf.artist || "ROMRO Beats";

        function formatTime(s) {
          if (isNaN(s)) return "0:00";
          const m = Math.floor(s / 60);
          const sec = Math.floor(s % 60).toString().padStart(2, '0');
          return `${m}:${sec}`;
        }

        audioElement.addEventListener('timeupdate', () => {
          if (audioElement.duration) {
            const pct = (audioElement.currentTime / audioElement.duration) * 100;
            progressFill.style.width = `${pct}%`;
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
            durationEl.textContent = formatTime(audioElement.duration);
          }
        });

        audioElement.addEventListener('loadedmetadata', () => {
          durationEl.textContent = formatTime(audioElement.duration);
        });

        progressContainer.addEventListener('click', (e) => {
          const rect = progressContainer.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const pct = clickX / rect.width;
          if (audioElement.duration) {
            audioElement.currentTime = pct * audioElement.duration;
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          audioElement.volume = parseFloat(e.target.value);
        });

        function togglePlay() {
          if (audioElement.paused) {
            audioElement.play().then(() => {
              isPlaying = true;
              playIcon.style.display = 'none';
              pauseIcon.style.display = 'block';
              visualizer.classList.add('playing');
            }).catch(e => console.log("Audio play prevented:", e));
          } else {
            audioElement.pause();
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            visualizer.classList.remove('playing');
          }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        // Click-to-enter guns.lol authentic modal
        const enterOverlay = document.getElementById('enter-overlay');
        enterOverlay.addEventListener('click', () => {
          enterOverlay.classList.add('hidden');
          togglePlay();
        });
      } else {
        audioCard.style.display = 'none';
        document.getElementById('enter-overlay').classList.add('hidden');
      }

      // 13. 3D Card Tilt on Hover
      const tiltWrapper = document.getElementById('card-tilt-wrapper');
      const tiltEnabled = config.effects ? (config.effects.cardTilt3D !== false) : true;

      if (tiltEnabled) {
        document.addEventListener('mousemove', (e) => {
          const rect = tiltWrapper.getBoundingClientRect();
          const cardX = rect.left + rect.width / 2;
          const cardY = rect.top + rect.height / 2;
          const deltaX = (e.clientX - cardX) / (window.innerWidth / 2);
          const deltaY = (e.clientY - cardY) / (window.innerHeight / 2);
          
          const rotateX = deltaY * -12;
          const rotateY = deltaX * 12;
          tiltWrapper.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
        });

        document.addEventListener('mouseleave', () => {
          tiltWrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
      }

      // 14. Canvas Particle Effects Engine (sparkles, snow, rain, matrix)
      const particleMode = (config.effects && config.effects.particleEffect) || "sparkles";
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      if (particleMode !== "none") {
        const particles = [];
        const count = particleMode === "matrix" ? 60 : 70;

        // Particle class
        class Particle {
          constructor() {
            this.reset();
          }
          reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 1;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.speedY = Math.random() * 0.8 + 0.3;
            this.opacity = Math.random() * 0.7 + 0.2;
            this.fadeSpeed = Math.random() * 0.015 + 0.005;
            this.fadingIn = true;
            this.char = particleMode === "matrix" ? String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96)) : "";
          }
          update() {
            if (particleMode === "sparkles") {
              if (this.fadingIn) {
                this.opacity += this.fadeSpeed;
                if (this.opacity >= 0.9) this.fadingIn = false;
              } else {
                this.opacity -= this.fadeSpeed;
                if (this.opacity <= 0.05) this.reset();
              }
              this.y -= this.speedY * 0.4;
            } else if (particleMode === "snow") {
              this.y += this.speedY;
              this.x += Math.sin(this.y * 0.02) * 0.6;
              if (this.y > canvas.height) this.y = -10;
            } else if (particleMode === "rain") {
              this.y += this.speedY * 6;
              this.x += 1;
              if (this.y > canvas.height) this.y = -10;
            } else if (particleMode === "matrix") {
              this.y += this.speedY * 3;
              if (this.y > canvas.height) {
                this.y = -20;
                this.char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
              }
            }
          }
          draw() {
            ctx.save();
            if (particleMode === "sparkles") {
              ctx.fillStyle = `rgba(167, 139, 250, ${this.opacity})`;
              ctx.shadowColor = 'rgba(123, 92, 248, 0.8)';
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (particleMode === "snow") {
              ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (particleMode === "rain") {
              ctx.strokeStyle = `rgba(123, 92, 248, ${this.opacity * 0.7})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y);
              ctx.lineTo(this.x + 2, this.y + 12);
              ctx.stroke();
            } else if (particleMode === "matrix") {
              ctx.fillStyle = `rgba(16, 185, 129, ${this.opacity})`;
              ctx.font = '14px monospace';
              ctx.fillText(this.char, this.x, this.y);
            }
            ctx.restore();
          }
        }

        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.update();
            p.draw();
          });
          requestAnimationFrame(animate);
        }
        animate();
      }

    })();
  </script>
</body>
</html>
