<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>romeo | Bio Link</title>
  <meta name="description" content="romeo - Custom aesthetic bio-link profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Load Config in Head -->
  <script src="config.js"></script>

  <style>
    /* CSS Variables & Theme Engine (14 Total Themes) */
    :root {
      --bg-base: #050519;
      --bg-surface: rgba(14, 14, 35, 0.72);
      --primary: #7B5CF8;
      --primary-rgb: 123, 92, 248;
      --secondary: #9E86FB;
      --accent-glow: rgba(123, 92, 248, 0.45);
      --accent-glow-strong: rgba(123, 92, 248, 0.85);
      --border-color: rgba(123, 92, 248, 0.25);
      --border-color-hover: rgba(123, 92, 248, 0.65);
      --text-main: #FFFFFF;
      --text-muted: #9499B7;
      --card-blur: 20px;
      --card-opacity: 0.72;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Space Grotesk', sans-serif;
    }

    /* 1. Blurple */
    body[data-theme="blurple"] {
      --bg-base: #050519;
      --primary: #7B5CF8;
      --primary-rgb: 123, 92, 248;
      --secondary: #A78BFA;
      --accent-glow: rgba(123, 92, 248, 0.45);
      --accent-glow-strong: rgba(123, 92, 248, 0.85);
      --border-color: rgba(123, 92, 248, 0.25);
      --border-color-hover: rgba(123, 92, 248, 0.65);
    }

    /* 2. Crimson */
    body[data-theme="crimson"] {
      --bg-base: #140505;
      --primary: #EF4444;
      --primary-rgb: 239, 68, 68;
      --secondary: #F87171;
      --accent-glow: rgba(239, 68, 68, 0.45);
      --accent-glow-strong: rgba(239, 68, 68, 0.85);
      --border-color: rgba(239, 68, 68, 0.25);
      --border-color-hover: rgba(239, 68, 68, 0.65);
    }

    /* 3. Emerald */
    body[data-theme="emerald"] {
      --bg-base: #04140e;
      --primary: #10B981;
      --primary-rgb: 16, 185, 129;
      --secondary: #34D399;
      --accent-glow: rgba(16, 185, 129, 0.45);
      --accent-glow-strong: rgba(16, 185, 129, 0.85);
      --border-color: rgba(16, 185, 129, 0.25);
      --border-color-hover: rgba(16, 185, 129, 0.65);
    }

    /* 4. Amber */
    body[data-theme="amber"] {
      --bg-base: #140d04;
      --primary: #F59E0B;
      --primary-rgb: 245, 158, 11;
      --secondary: #FBBF24;
      --accent-glow: rgba(245, 158, 11, 0.45);
      --accent-glow-strong: rgba(245, 158, 11, 0.85);
      --border-color: rgba(245, 158, 11, 0.25);
      --border-color-hover: rgba(245, 158, 11, 0.65);
    }

    /* 5. Ocean */
    body[data-theme="ocean"] {
      --bg-base: #041217;
      --primary: #06B6D4;
      --primary-rgb: 6, 182, 212;
      --secondary: #38BDF8;
      --accent-glow: rgba(6, 182, 212, 0.45);
      --accent-glow-strong: rgba(6, 182, 212, 0.85);
      --border-color: rgba(6, 182, 212, 0.25);
      --border-color-hover: rgba(6, 182, 212, 0.65);
    }

    /* 6. Rose */
    body[data-theme="rose"] {
      --bg-base: #17040a;
      --primary: #F43F5E;
      --primary-rgb: 244, 63, 94;
      --secondary: #FB7185;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --accent-glow-strong: rgba(244, 63, 94, 0.85);
      --border-color: rgba(244, 63, 94, 0.25);
      --border-color-hover: rgba(244, 63, 94, 0.65);
    }

    /* 7. Void */
    body[data-theme="void"] {
      --bg-base: #030305;
      --primary: #94A3B8;
      --primary-rgb: 148, 163, 184;
      --secondary: #CBD5E1;
      --accent-glow: rgba(148, 163, 184, 0.25);
      --accent-glow-strong: rgba(148, 163, 184, 0.55);
      --border-color: rgba(255, 255, 255, 0.14);
      --border-color-hover: rgba(255, 255, 255, 0.4);
    }

    /* 8. Retro */
    body[data-theme="retro"] {
      --bg-base: #110416;
      --primary: #EC4899;
      --primary-rgb: 236, 72, 153;
      --secondary: #06B6D4;
      --accent-glow: rgba(236, 72, 153, 0.55);
      --accent-glow-strong: rgba(6, 182, 212, 0.85);
      --border-color: rgba(236, 72, 153, 0.35);
      --border-color-hover: rgba(6, 182, 212, 0.75);
    }

    /* 9. Cyber (hot yellow #FFE600 + black base) */
    body[data-theme="cyber"] {
      --bg-base: #080802;
      --primary: #FFE600;
      --primary-rgb: 255, 230, 0;
      --secondary: #00F0FF;
      --accent-glow: rgba(255, 230, 0, 0.5);
      --accent-glow-strong: rgba(255, 230, 0, 0.9);
      --border-color: rgba(255, 230, 0, 0.32);
      --border-color-hover: rgba(255, 230, 0, 0.8);
    }

    /* 10. Sakura (soft pink #FF6B9D + cherry blossom vibe) */
    body[data-theme="sakura"] {
      --bg-base: #1a0d16;
      --primary: #FF6B9D;
      --primary-rgb: 255, 107, 157;
      --secondary: #FFA8C5;
      --accent-glow: rgba(255, 107, 157, 0.45);
      --accent-glow-strong: rgba(255, 107, 157, 0.8);
      --border-color: rgba(255, 107, 157, 0.3);
      --border-color-hover: rgba(255, 107, 157, 0.75);
    }

    /* 11. Midnight (deep navy #1E3A5F + ice blue #7EC8E3) */
    body[data-theme="midnight"] {
      --bg-base: #07101c;
      --primary: #7EC8E3;
      --primary-rgb: 126, 200, 227;
      --secondary: #1E3A5F;
      --accent-glow: rgba(126, 200, 227, 0.45);
      --accent-glow-strong: rgba(126, 200, 227, 0.85);
      --border-color: rgba(126, 200, 227, 0.28);
      --border-color-hover: rgba(126, 200, 227, 0.7);
    }

    /* 12. Neon (electric lime #ADFF2F + hot pink #FF006E dual accent) */
    body[data-theme="neon"] {
      --bg-base: #060d03;
      --primary: #ADFF2F;
      --primary-rgb: 173, 255, 47;
      --secondary: #FF006E;
      --accent-glow: rgba(173, 255, 47, 0.55);
      --accent-glow-strong: rgba(255, 0, 110, 0.85);
      --border-color: rgba(173, 255, 47, 0.35);
      --border-color-hover: rgba(255, 0, 110, 0.75);
    }

    /* 13. Galaxy (nebula purple #8B5CF6 + star gold #FCD34D) */
    body[data-theme="galaxy"] {
      --bg-base: #080415;
      --primary: #8B5CF6;
      --primary-rgb: 139, 92, 246;
      --secondary: #FCD34D;
      --accent-glow: rgba(139, 92, 246, 0.5);
      --accent-glow-strong: rgba(252, 211, 77, 0.8);
      --border-color: rgba(139, 92, 246, 0.32);
      --border-color-hover: rgba(252, 211, 77, 0.75);
    }

    /* 14. Toxic (radioactive green #39FF14 + dark bg) */
    body[data-theme="toxic"] {
      --bg-base: #030d04;
      --primary: #39FF14;
      --primary-rgb: 57, 255, 20;
      --secondary: #00FF87;
      --accent-glow: rgba(57, 255, 20, 0.55);
      --accent-glow-strong: rgba(57, 255, 20, 0.9);
      --border-color: rgba(57, 255, 20, 0.35);
      --border-color-hover: rgba(57, 255, 20, 0.85);
    }

    /* 6 CSS-Only Background Presets */
    body[data-bg="aurora"] #bg-layer {
      background: linear-gradient(135deg, #021B2B 0%, #150033 35%, #00363A 68%, #1B003A 100%) !important;
      background-size: 300% 300% !important;
      animation: auroraShift 16s ease infinite !important;
    }
    @keyframes auroraShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body[data-bg="sunset"] #bg-layer {
      background: linear-gradient(145deg, #2A0845 0%, #641755 35%, #B83B5E 70%, #F08A5D 100%) !important;
      background-size: 250% 250% !important;
      animation: sunsetShift 18s ease infinite !important;
    }
    @keyframes sunsetShift {
      0% { background-position: 0% 40%; }
      50% { background-position: 100% 60%; }
      100% { background-position: 0% 40%; }
    }

    body[data-bg="matrix"] #bg-layer {
      background: #000000 !important;
    }

    body[data-bg="deep_space"] #bg-layer {
      background: radial-gradient(ellipse at 50% 100%, #162035 0%, #070A12 65%, #020306 100%) !important;
    }

    body[data-bg="vaporwave"] #bg-layer {
      background: linear-gradient(135deg, #18092B 0%, #4A0E4E 35%, #C2185B 70%, #00BCD4 100%) !important;
      background-size: 260% 260% !important;
      animation: vaporShift 18s ease infinite !important;
    }
    @keyframes vaporShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body[data-bg="forest"] #bg-layer {
      background: linear-gradient(140deg, #05130b 0%, #0a2517 40%, #123821 72%, #07190e 100%) !important;
      background-size: 240% 240% !important;
      animation: forestShift 20s ease infinite !important;
    }
    @keyframes forestShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Base Reset & Core Typography */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      width: 100%;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Custom Cursor Styles */
    body.cursor-dot {
      cursor: none;
    }
    body.cursor-crosshair {
      cursor: crosshair;
    }
    #custom-cursor-dot {
      display: none;
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
      transition: width 0.15s ease, height 0.15s ease, background-color 0.2s ease;
    }
    #custom-cursor-follower {
      display: none;
      position: fixed;
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--primary);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out, border-color 0.2s ease;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(5, 5, 25, 0.85);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    /* Background Setup */
    #bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: background 0.6s ease;
    }
    #bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      display: none;
    }
    #bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 25, 0.65);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* Subtle Pattern Overlay (Grid Dots) */
    #bg-pattern {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.4;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Click to Enter Overlay (Guns.lol Authentic Autoplay Barrier) */
    #enter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 25, 0.94);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
    }
    #enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .enter-prompt {
      font-size: 1.15rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: pulseText 2.2s ease-in-out infinite;
    }
    .enter-prompt .pulse-dot {
      width: 14px;
      height: 14px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 24px var(--primary), 0 0 45px var(--accent-glow-strong);
    }
    .enter-subtext {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* Top Controls Bar (Themes, Backgrounds, Visual Editor) */
    .top-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      background: rgba(14, 14, 35, 0.78);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-color);
      color: #FFFFFF;
      padding: 0 14px;
      min-height: 44px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      user-select: none;
    }
    .nav-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }
    .nav-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Dropdown Menus for Theme & Background */
    .dropdown-container {
      position: relative;
    }
    .dropdown-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(12, 12, 30, 0.96);
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px;
      display: none;
      gap: 6px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 25px var(--accent-glow);
      z-index: 210;
      max-height: 80vh;
      overflow-y: auto;
    }
    .dropdown-panel.active {
      display: grid;
    }
    .theme-grid-panel {
      grid-template-columns: repeat(2, 1fr);
      width: 260px;
    }
    .bg-grid-panel {
      grid-template-columns: 1fr;
      width: 220px;
    }
    .dropdown-opt {
      padding: 0 12px;
      min-height: 44px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      color: #DDD;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      text-align: left;
    }
    .dropdown-opt:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-color);
      color: #FFF;
      transform: translateX(2px);
    }
    .dropdown-opt.active {
      background: rgba(var(--primary-rgb), 0.18);
      border-color: var(--primary);
      color: #FFF;
      font-weight: 700;
    }
    .dot-preview {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    /* Main App Layout */
    .app-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 1.25rem 4rem;
      perspective: 1200px;
      width: 100%;
    }

    /* 3D Tilt Wrapper */
    .card-tilt-container {
      width: 100%;
      max-width: 480px;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      display: flex;
      justify-content: center;
    }

    /* Profile Card Outer with Rotating Conic Border-Beam */
    .profile-card-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 30px;
      padding: 1.5px;
      overflow: hidden;
      background: transparent;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 35px var(--accent-glow);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    }
    .profile-card-wrapper:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 70px -12px rgba(0, 0, 0, 0.85), 0 0 50px var(--accent-glow-strong);
    }

    /* Rotating Conic Gradient Border Beam Effect */
    .border-beam {
      position: absolute;
      inset: -150%;
      width: 400%;
      height: 400%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg 280deg,
        var(--primary) 325deg,
        var(--secondary) 360deg
      );
      animation: rotateBeam 6.5s linear infinite;
      pointer-events: none;
      z-index: 1;
      opacity: 0.8;
    }
    @keyframes rotateBeam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Main Glass Card Inner */
    .profile-card {
      position: relative;
      z-index: 2;
      width: 100%;
      border-radius: 28.5px;
      background: var(--bg-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 2.5rem 1.85rem 2.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .profile-card::before {
      content: '';
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.65;
      z-index: 0;
    }

    .card-content {
      position: relative;
      z-index: 3;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Avatar with Pulsing Glow Ring */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 1.35rem;
      display: inline-block;
    }
    .avatar-pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: avatarPulse 2.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes avatarPulse {
      0% { transform: scale(0.96); opacity: 0.9; box-shadow: 0 0 10px var(--accent-glow); }
      50% { transform: scale(1.1); opacity: 0.25; box-shadow: 0 0 30px var(--accent-glow-strong); }
      100% { transform: scale(0.96); opacity: 0.9; box-shadow: 0 0 10px var(--accent-glow); }
    }
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
      border: 2.5px solid var(--primary);
      box-shadow: 0 0 25px var(--accent-glow), inset 0 0 15px rgba(0, 0, 0, 0.5);
      background: #090919;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.05) rotate(2deg);
    }
    .status-indicator {
      position: absolute;
      bottom: 4px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3.5px solid #0b0b1f;
      background-color: #10B981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
      z-index: 3;
    }
    .status-indicator.online { background-color: #10B981; box-shadow: 0 0 10px #10B981; }
    .status-indicator.idle { background-color: #F59E0B; box-shadow: 0 0 10px #F59E0B; }
    .status-indicator.dnd { background-color: #EF4444; box-shadow: 0 0 10px #EF4444; }
    .status-indicator.offline { background-color: #64748B; box-shadow: 0 0 10px #64748B; }

    /* Badges System */
    .badges-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .badge-tag {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }
    .badge-tag:hover {
      transform: translateY(-2px);
    }

    /* Username & Glow Effect */
    .username-wrapper {
      margin-bottom: 0.6rem;
      position: relative;
      display: inline-block;
    }
    .profile-username {
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      color: #FFFFFF;
      position: relative;
      filter: drop-shadow(0 0 24px var(--accent-glow-strong)) drop-shadow(0 0 8px var(--primary));
      transition: font-size 0.2s ease;
    }
    .profile-username.effect-gradient {
      background: linear-gradient(135deg, #FFFFFF 20%, var(--primary) 70%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .profile-username.effect-rainbow {
      background: linear-gradient(90deg, #ff0055, #ff9900, #33cc33, #00ccff, #9933ff, #ff0055);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowShift 4s linear infinite;
    }
    @keyframes rainbowShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    .profile-username.effect-glitch {
      position: relative;
      color: #fff;
    }
    .profile-username.effect-glitch::before,
    .profile-username.effect-glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }
    .profile-username.effect-glitch::before {
      left: -2px;
      text-shadow: 2px 0 #EF4444;
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }
    .profile-username.effect-glitch::after {
      left: 2px;
      text-shadow: -2px 0 #06B6D4;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    @keyframes glitch-anim-1 {
      0% { clip: rect(20px, 9999px, 40px, 0); }
      20% { clip: rect(60px, 9999px, 80px, 0); }
      40% { clip: rect(10px, 9999px, 30px, 0); }
      60% { clip: rect(70px, 9999px, 90px, 0); }
      80% { clip: rect(40px, 9999px, 60px, 0); }
      100% { clip: rect(5px, 9999px, 25px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(50px, 9999px, 70px, 0); }
      20% { clip: rect(15px, 9999px, 35px, 0); }
      40% { clip: rect(80px, 9999px, 100px, 0); }
      60% { clip: rect(30px, 9999px, 50px, 0); }
      80% { clip: rect(65px, 9999px, 85px, 0); }
      100% { clip: rect(25px, 9999px, 45px, 0); }
    }
    .profile-username.effect-typewriter::after {
      content: '|';
      color: var(--primary);
      animation: blinkCursor 0.9s infinite;
      margin-left: 2px;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Bio Text */
    .profile-bio {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.5;
      max-width: 92%;
      margin-bottom: 1.25rem;
    }

    /* View Counter Badge */
    .view-counter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 1.4rem;
    }
    .view-counter svg {
      width: 14px;
      height: 14px;
      fill: var(--primary);
    }
    .view-count-number {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Social Links Grid */
    .socials-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 1.4rem;
    }
    .social-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 6px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      overflow: hidden;
      touch-action: manipulation;
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.25s ease, fill 0.25s ease;
      flex-shrink: 0;
    }
    .social-btn span {
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
    }
    .social-btn:hover {
      background: rgba(var(--primary-rgb), 0.14);
      border-color: var(--primary);
      color: #FFFFFF;
      transform: translateY(-4px);
      box-shadow: 0 10px 24px -4px var(--accent-glow);
    }
    .social-btn:hover svg {
      transform: scale(1.15);
      fill: var(--primary);
    }

    /* Audio Player Component */
    .audio-player-card {
      width: 100%;
      background: rgba(10, 10, 26, 0.45);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }
    .audio-player-card:hover {
      border-color: var(--border-color-hover);
      box-shadow: 0 8px 24px -4px var(--accent-glow);
      transform: translateY(-2px);
    }
    .audio-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }
    .audio-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      overflow: hidden;
      flex: 1;
    }
    .play-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.2s ease, background-color 0.2s ease;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .play-btn:hover {
      transform: scale(1.08);
      background: var(--secondary);
    }
    .play-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .song-details {
      overflow: hidden;
      flex: 1;
    }
    .song-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .song-note-icon {
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .song-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.74rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* Audio visualizer bars */
    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3.5px;
      height: 20px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .audio-visualizer .bar {
      width: 3.5px;
      background: var(--primary);
      border-radius: 2px;
      height: 4px;
      transition: height 0.15s ease, background-color 0.2s ease;
    }
    .audio-visualizer.playing .bar:nth-child(1) { animation: bounce 0.8s ease-in-out infinite alternate; }
    .audio-visualizer.playing .bar:nth-child(2) { animation: bounce 1.1s ease-in-out infinite alternate 0.2s; }
    .audio-visualizer.playing .bar:nth-child(3) { animation: bounce 0.9s ease-in-out infinite alternate 0.4s; }
    .audio-visualizer.playing .bar:nth-child(4) { animation: bounce 1.25s ease-in-out infinite alternate 0.1s; }
    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 20px; }
    }

    /* Audio Progress Bar & Volume */
    .audio-controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      touch-action: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--primary);
      border-radius: 6px;
      position: relative;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .time-display {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      min-width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .volume-slider {
      width: 65px;
      accent-color: var(--primary);
      cursor: pointer;
      height: 6px;
      flex-shrink: 0;
    }

    /* Discord Presence Card */
    .discord-card {
      width: 100%;
      background: rgba(10, 10, 26, 0.45);
      border: 1px solid rgba(88, 101, 242, 0.28);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.4rem;
      text-align: left;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }
    .discord-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .discord-card:hover {
      border-color: rgba(88, 101, 242, 0.65);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px -4px rgba(88, 101, 242, 0.35);
    }
    .discord-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .discord-avatar-wrap img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #111;
      border: 2px solid rgba(88, 101, 242, 0.5);
    }
    .discord-status-dot {
      position: absolute;
      bottom: 0px;
      right: 0px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px solid #090919;
    }
    .discord-meta {
      flex: 1;
      overflow: hidden;
    }
    .discord-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .discord-username {
      font-size: 0.88rem;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-badge {
      font-size: 0.65rem;
      background: #5865F2;
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .discord-activity {
      font-size: 0.78rem;
      color: #A3A8CA;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-details {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .discord-time {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--primary);
      margin-top: 2px;
    }

    /* Copy Discord Tag Button */
    .copy-tag-btn {
      background: rgba(88, 101, 242, 0.15);
      border: 1px solid rgba(88, 101, 242, 0.4);
      color: #FFF;
      padding: 0 10px;
      min-height: 44px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      user-select: none;
      touch-action: manipulation;
    }
    .copy-tag-btn:hover {
      background: rgba(88, 101, 242, 0.35);
      border-color: #5865F2;
      box-shadow: 0 0 14px rgba(88, 101, 242, 0.5);
      transform: translateY(-2px);
    }
    .copy-tag-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* About Me Box */
    .about-box {
      width: 100%;
      background: rgba(10, 10, 26, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 0.8rem;
      transition: all 0.25s ease;
    }
    .about-box:hover {
      border-color: var(--border-color-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px -4px var(--accent-glow);
    }
    .about-box-title {
      font-size: 0.82rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .about-box-content {
      font-size: 0.85rem;
      color: #C1C6E2;
      line-height: 1.6;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 6px;
      white-space: pre-wrap;
    }

    /* Footer */
    .profile-footer {
      margin-top: 1.4rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
    }
    .profile-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }
    .profile-footer a:hover {
      color: var(--secondary);
      text-decoration: underline;
    }

    /* Mobile Sticky Audio Placeholder (Hidden by default on desktop) */
    .mobile-audio-placeholder {
      display: none;
      width: 100%;
      height: 82px;
    }

    /* RESPONSIVE BREAKPOINTS (Mobile-First Architecture) */

    /* Desktop (1024px+) */
    @media (min-width: 1024px) {
      .app-wrapper {
        padding: 5rem 1.5rem 4rem;
      }
      .profile-card-wrapper {
        max-width: 480px;
      }
      .socials-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Tablet Landscape / Small Desktop (768px - 1023px) */
    @media (min-width: 768px) and (max-width: 1023px) {
      .app-wrapper {
        padding: 4.5rem 1.25rem 4rem;
      }
      .profile-card-wrapper {
        max-width: 470px;
      }
      .socials-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Tablet Portrait & Large Phones (481px - 767px) */
    @media (min-width: 481px) and (max-width: 767px) {
      .app-wrapper {
        padding: 4.5rem 1rem 4rem;
      }
      .profile-card-wrapper {
        max-width: 460px;
        width: 100%;
      }
      .socials-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Mobile Screens (<= 480px) */
    @media (max-width: 480px) {
      .app-wrapper {
        padding: 4.5rem 0.75rem 6.5rem; /* Extra bottom padding so sticky audio bar never obscures content */
        justify-content: flex-start;
      }
      .card-tilt-container {
        max-width: 100%;
      }
      .profile-card-wrapper {
        max-width: 100%;
        width: 100%;
        border-radius: 24px;
      }
      .profile-card {
        padding: 1.75rem 1.15rem 1.5rem;
        border-radius: 22.5px;
      }
      .avatar-img {
        width: 96px;
        height: 96px;
      }
      .profile-username {
        font-size: 1.75rem;
      }
      .profile-bio {
        font-size: 0.85rem;
      }
      
      /* Social Links: STRICT 2 COLUMNS ON MOBILE */
      .socials-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px;
      }
      .social-btn {
        min-height: 48px;
        padding: 8px 6px;
      }
      .social-btn span {
        max-width: 100px;
      }

      /* Sticky Audio Player Bar at Bottom on Mobile */
      .mobile-audio-placeholder {
        display: block;
      }
      .audio-player-card {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        margin: 0;
        border-radius: 22px 22px 0 0;
        z-index: 950;
        background: rgba(10, 10, 26, 0.95);
        backdrop-filter: blur(28px) saturate(200%);
        -webkit-backdrop-filter: blur(28px) saturate(200%);
        border: 1px solid var(--border-color);
        border-bottom: none;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7), 0 -2px 18px var(--accent-glow);
        padding: 12px 16px max(14px, env(safe-area-inset-bottom, 14px));
      }
      .audio-player-card:hover {
        transform: none; /* Avoid jumping off bottom on mobile */
      }
      .volume-slider {
        display: none; /* Hide volume slider on mobile; hardware buttons manage volume */
      }
      .top-bar {
        top: 10px;
        right: 10px;
        gap: 6px;
      }
      .nav-btn {
        padding: 0 10px;
        font-size: 0.76rem;
      }
      .nav-btn span.label-text {
        display: none; /* Icon-only on very tight top bars if needed */
      }
    }

    /* iPhone SE & Extra Compact Screens (<= 375px) */
    @media (max-width: 375px) {
      .app-wrapper {
        padding: 4.2rem 0.5rem 6.5rem;
      }
      .profile-card {
        padding: 1.5rem 0.9rem 1.25rem;
      }
      .profile-username {
        font-size: 1.55rem;
      }
      .discord-card {
        padding: 10px 12px;
      }
      .discord-avatar-wrap img {
        width: 40px;
        height: 40px;
      }
      .copy-tag-btn {
        padding: 0 8px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

  <!-- Top Right Navigation Bar -->
  <div class="top-bar">
    <!-- Themes Dropdown (14 Themes) -->
    <div class="dropdown-container">

      </button>
      <div class="dropdown-panel theme-grid-panel" id="theme-menu">

        <button class="dropdown-opt" data-theme-val="crimson"><span class="dot-preview" style="background:#EF4444"></span> Crimson</button>
        <button class="dropdown-opt" data-theme-val="emerald"><span class="dot-preview" style="background:#10B981"></span> Emerald</button>
        <button class="dropdown-opt" data-theme-val="amber"><span class="dot-preview" style="background:#F59E0B"></span> Amber</button>
        <button class="dropdown-opt" data-theme-val="ocean"><span class="dot-preview" style="background:#06B6D4"></span> Ocean</button>
        <button class="dropdown-opt" data-theme-val="rose"><span class="dot-preview" style="background:#F43F5E"></span> Rose</button>
        <button class="dropdown-opt" data-theme-val="void"><span class="dot-preview" style="background:#94A3B8"></span> Void</button>
        <button class="dropdown-opt" data-theme-val="retro"><span class="dot-preview" style="background:#EC4899"></span> Retro</button>
        <button class="dropdown-opt" data-theme-val="cyber"><span class="dot-preview" style="background:#FFE600"></span> Cyber</button>
        <button class="dropdown-opt" data-theme-val="sakura"><span class="dot-preview" style="background:#FF6B9D"></span> Sakura</button>
        <button class="dropdown-opt" data-theme-val="midnight"><span class="dot-preview" style="background:#7EC8E3"></span> Midnight</button>
        <button class="dropdown-opt" data-theme-val="neon"><span class="dot-preview" style="background:#ADFF2F"></span> Neon</button>
        <button class="dropdown-opt" data-theme-val="galaxy"><span class="dot-preview" style="background:#8B5CF6"></span> Galaxy</button>
        <button class="dropdown-opt" data-theme-val="toxic"><span class="dot-preview" style="background:#39FF14"></span> Toxic</button>
      </div>
    </div>

      // 2. Apply Theme & Background Preset
      const activeTheme = config.theme || "blurple";
      document.body.setAttribute('data-theme', activeTheme);

      const activeBg = config.bgPreset || (config.background && config.background.preset) || "aurora";
      document.body.setAttribute('data-bg', activeBg);

      // Theme Picker Dropdown Logic
      const themeBtn = document.getElementById('theme-btn');
      const themeMenu = document.getElementById('theme-menu');
      if (themeBtn && themeMenu) {
        themeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isAct = themeMenu.classList.contains('active');
          document.querySelectorAll('.dropdown-panel').forEach(p => p.classList.remove('active'));
          if (!isAct) themeMenu.classList.add('active');
        });

        themeMenu.querySelectorAll('.dropdown-opt').forEach(opt => {
          opt.addEventListener('click', (e) => {
            const chosen = opt.getAttribute('data-theme-val');
            document.body.setAttribute('data-theme', chosen);
            config.theme = chosen;
            try {
              localStorage.setItem('romro_custom_config', JSON.stringify(config));
            } catch(e){}
            themeMenu.classList.remove('active');
          });
        });
      }

      // Background Preset Picker Dropdown Logic
      const bgBtn = document.getElementById('bg-btn');
      const bgMenu = document.getElementById('bg-menu');
      if (bgBtn && bgMenu) {
        bgBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const isAct = bgMenu.classList.contains('active');
          document.querySelectorAll('.dropdown-panel').forEach(p => p.classList.remove('active'));
          if (!isAct) bgMenu.classList.add('active');
        });

        bgMenu.querySelectorAll('.dropdown-opt').forEach(opt => {
          opt.addEventListener('click', (e) => {
            const chosen = opt.getAttribute('data-bg-val');
            document.body.setAttribute('data-bg', chosen);
            config.bgPreset = chosen;
            if (!config.background) config.background = {};
            config.background.preset = chosen;
            try {
              localStorage.setItem('romro_custom_config', JSON.stringify(config));
            } catch(e){}
            bgMenu.classList.remove('active');
          });
        });
      }

      // Close dropdowns on outside click
      document.addEventListener('click', () => {
        document.querySelectorAll('.dropdown-panel').forEach(p => p.classList.remove('active'));
      });

      // 3. Custom Cursor Engine (disabled on touch devices)
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia("(pointer: coarse)").matches);
      const cursorDot = document.getElementById('custom-cursor-dot');
      const cursorFollower = document.getElementById('custom-cursor-follower');
      const cursorType = (config.effects && config.effects.customCursor) || "crosshair";

      if (!isTouchDevice && (cursorType === "dot" || cursorType === "crosshair")) {
        if (cursorType === "dot") {
          document.body.classList.add('cursor-dot');
          cursorDot.style.display = 'block';
          cursorFollower.style.display = 'block';
        } else {
          document.body.classList.add('cursor-crosshair');
        }

        window.addEventListener('mousemove', (e) => {
          if (cursorType === "dot") {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
            setTimeout(() => {
              cursorFollower.style.left = e.clientX + 'px';
              cursorFollower.style.top = e.clientY + 'px';
            }, 35);
          }
        });
      }

      // 4. Background Setup (Supports Preset, Video, Image, Solid)
      const bgLayer = document.getElementById('bg-layer');
      const bgVideo = document.getElementById('bg-video');
      const bgOverlay = document.getElementById('bg-overlay');
      const bgConf = config.background || {};

      if (bgConf.overlayOpacity !== undefined) {
        bgOverlay.style.background = `rgba(5, 5, 25, ${bgConf.overlayOpacity})`;
      }

      if (bgConf.type === "video" && bgConf.videoUrl) {
        bgVideo.src = bgConf.videoUrl;
        bgVideo.style.display = 'block';
      } else if (bgConf.type === "image" && bgConf.imageUrl) {
        bgLayer.style.backgroundImage = `url('${bgConf.imageUrl}')`;
      } else if (bgConf.type === "solid") {
        bgLayer.style.backgroundColor = bgConf.solidColor || '#050519';
      }

      // 5. Card Opacity & Blur Controls
      const profileCard = document.getElementById('profile-card');
      const cardBlur = (config.effects && config.effects.cardBlur !== undefined) ? config.effects.cardBlur : 20;
      const cardOpacity = (config.effects && config.effects.cardOpacity !== undefined) ? config.effects.cardOpacity : 0.72;
      document.documentElement.style.setProperty('--card-blur', `${cardBlur}px`);
      document.documentElement.style.setProperty('--card-opacity', `${cardOpacity}`);
      profileCard.style.backgroundColor = `rgba(14, 14, 35, ${cardOpacity})`;

      // 6. Profile Avatar, Username & Bio (romeo)
      const avatarImg = document.getElementById('avatar-img');
      avatarImg.src = config.avatar || "https://api.dicebear.com/7.x/avataaars/svg?seed=romeo";
      
      const usernameEl = document.getElementById('profile-username');
      const uname = config.displayName || config.username || "romeo";
      usernameEl.textContent = uname;
      usernameEl.setAttribute('data-text', uname);

      // Username Text Effect
      const effect = (config.effects && config.effects.usernameEffect) || "gradient";
      usernameEl.className = `profile-username effect-${effect}`;
      
      if (effect === "typewriter") {
        let i = 0;
        let isDeleting = false;
        const speed = 120;
        const pause = 2000;
        function typeLoop() {
          const current = isDeleting ? uname.substring(0, i--) : uname.substring(0, i++);
          usernameEl.textContent = current;
          if (!isDeleting && i > uname.length) {
            isDeleting = true;
            setTimeout(typeLoop, pause);
          } else if (isDeleting && i < 0) {
            isDeleting = false;
            i = 0;
            setTimeout(typeLoop, 500);
          } else {
            setTimeout(typeLoop, isDeleting ? speed / 2 : speed);
          }
        }
        typeLoop();
      }

      const bioEl = document.getElementById('profile-bio');
      bioEl.textContent = config.bio || "";

      // 7. Badges System
      const badgesContainer = document.getElementById('badges-container');
      badgesContainer.innerHTML = '';
      if (Array.isArray(config.badges)) {
        config.badges.forEach(b => {
          const badge = document.createElement('div');
          badge.className = 'badge-tag';
          badge.textContent = b.text;
          badge.style.backgroundColor = b.color || 'var(--primary)';
          badge.style.color = b.textColor || '#FFFFFF';
          badge.style.boxShadow = `0 0 14px ${b.glow || 'rgba(123, 92, 248, 0.45)'}`;
          badgesContainer.appendChild(badge);
        });
      }

      // 8. View Counter
      const viewsConf = config.views || { enabled: true, initialCount: 1337 };
      const viewCounterWrap = document.getElementById('view-counter-container');
      if (viewsConf.enabled) {
        let count = parseInt(localStorage.getItem('romro_views') || viewsConf.initialCount || 1337, 10);
        count += 1;
        localStorage.setItem('romro_views', count);
        document.getElementById('view-count-number').textContent = count.toLocaleString();
        document.getElementById('view-count-label').textContent = viewsConf.label || "views";
      } else {
        viewCounterWrap.style.display = 'none';
      }

      // 9. Socials Grid
      const socialsGrid = document.getElementById('socials-grid');
      socialsGrid.innerHTML = '';
      if (Array.isArray(config.socials)) {
        config.socials.forEach(s => {
          const a = document.createElement('a');
          a.className = 'social-btn';
          a.href = s.url || '#';
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.title = `${s.label} (${s.handle || ''})`;
          
          const iconSvg = SOCIAL_ICONS[s.platform.toLowerCase()] || '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>';
          a.innerHTML = `${iconSvg}<span>${s.label || s.platform}</span>`;
          socialsGrid.appendChild(a);
        });
      }

      // 10. Discord Presence Card & Dedicated "Copy Discord Tag" Button
      const discordConf = config.discord || { enabled: true };
      const discordCard = document.getElementById('discord-card');
      const copyDiscordBtn = document.getElementById('copy-discord-btn');
      const copyBtnText = document.getElementById('copy-btn-text');

      if (discordConf.enabled) {
        const discordTag = discordConf.username || "romeo#0001";
        document.getElementById('discord-user').textContent = discordTag;
        document.getElementById('discord-avatar').src = discordConf.avatar || "https://api.dicebear.com/7.x/bottts/svg?seed=romeo-bot";
        
        const dot = document.getElementById('discord-status-dot');
        dot.className = `discord-status-dot ${discordConf.status || 'online'}`;
        
        const avatarDot = document.getElementById('avatar-status');
        avatarDot.className = `status-indicator ${discordConf.status || 'online'}`;

        document.getElementById('discord-activity-line').textContent = `${discordConf.activityType || 'Playing'} ${discordConf.activityName || 'Visual Studio Code'}`;
        document.getElementById('discord-details-line').textContent = discordConf.details || "Developing ROMRO Bio-Link Platform";
        
        // Live elapsed timer
        let secondsElapsed = 260; // 04:20
        const timeLine = document.getElementById('discord-time-line');
        setInterval(() => {
          secondsElapsed++;
          const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
          const secs = (secondsElapsed % 60).toString().padStart(2, '0');
          timeLine.textContent = `${mins}:${secs} elapsed`;
        }, 1000);

        // Copy Discord Tag logic
        if (copyDiscordBtn) {
          copyDiscordBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(discordTag).then(() => {
              copyBtnText.textContent = "Copied! ✓";
              copyDiscordBtn.style.borderColor = "#10B981";
              copyDiscordBtn.style.background = "rgba(16, 185, 129, 0.25)";
              setTimeout(() => {
                copyBtnText.textContent = "Copy";
                copyDiscordBtn.style.borderColor = "rgba(88, 101, 242, 0.4)";
                copyDiscordBtn.style.background = "rgba(88, 101, 242, 0.15)";
              }, 2200);
            }).catch(err => {
              console.error("Clipboard copy failed:", err);
            });
          });
        }
      } else {
        discordCard.style.display = 'none';
      }

      // 11. About Me Box
      const aboutConf = config.aboutMe || { enabled: true };
      const aboutBox = document.getElementById('about-box');
      if (aboutConf.enabled) {
        document.getElementById('about-box-title-text').textContent = aboutConf.title || "About Me";
        document.getElementById('about-box-content').textContent = aboutConf.content || "";
      } else {
        aboutBox.style.display = 'none';
      }

      // 12. Audio Player Logic (Rickroll - Never Gonna Give You Up)
      const audioConf = config.audio || { enabled: true };
      const audioCard = document.getElementById('audio-player-card');
      const audioElement = document.getElementById('bg-audio');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const visualizer = document.getElementById('audio-visualizer');
      const songTitle = document.getElementById('song-title');
      const songArtist = document.getElementById('song-artist');
      const progressFill = document.getElementById('audio-progress-fill');
      const progressContainer = document.getElementById('audio-progress-container');
      const currentTimeEl = document.getElementById('audio-current-time');
      const durationEl = document.getElementById('audio-duration');
      const volumeSlider = document.getElementById('audio-volume');

      let isPlaying = false;

      if (audioConf.enabled) {
        audioElement.src = audioConf.audioUrl || "https://ia801406.us.archive.org/21/items/rick-astley-never-gonna-give-you-up_202007/Rick%20Astley%20-%20Never%20Gonna%20Give%20You%20Up.mp3";
        audioElement.volume = audioConf.volume !== undefined ? audioConf.volume : 0.65;
        volumeSlider.value = audioElement.volume;
        songTitle.textContent = audioConf.title || "Never Gonna Give You Up";
        songArtist.textContent = `🎶 ${audioConf.artist || 'Rick Astley'}`;

        function formatTime(s) {
          if (isNaN(s)) return "0:00";
          const m = Math.floor(s / 60);
          const sec = Math.floor(s % 60).toString().padStart(2, '0');
          return `${m}:${sec}`;
        }

        audioElement.addEventListener('timeupdate', () => {
          if (audioElement.duration) {
            const pct = (audioElement.currentTime / audioElement.duration) * 100;
            progressFill.style.width = `${pct}%`;
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
            durationEl.textContent = formatTime(audioElement.duration);
          }
        });

        audioElement.addEventListener('loadedmetadata', () => {
          durationEl.textContent = formatTime(audioElement.duration);
        });

        progressContainer.addEventListener('click', (e) => {
          const rect = progressContainer.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const pct = Math.max(0, Math.min(1, clickX / rect.width));
          if (audioElement.duration) {
            audioElement.currentTime = pct * audioElement.duration;
          }
        });

        volumeSlider.addEventListener('input', (e) => {
          audioElement.volume = parseFloat(e.target.value);
        });

        function togglePlay() {
          if (audioElement.paused) {
            audioElement.play().then(() => {
              isPlaying = true;
              playIcon.style.display = 'none';
              pauseIcon.style.display = 'block';
              visualizer.classList.add('playing');
            }).catch(e => console.log("Audio play prevented:", e));
          } else {
            audioElement.pause();
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            visualizer.classList.remove('playing');
          }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        // Click-to-enter guns.lol authentic entry screen
        const enterOverlay = document.getElementById('enter-overlay');
        enterOverlay.addEventListener('click', () => {
          enterOverlay.classList.add('hidden');
          togglePlay();
        });
      } else {
        audioCard.style.display = 'none';
        document.getElementById('enter-overlay').classList.add('hidden');
      }

      // 13. 3D Card Tilt on Hover (DISABLED ON TOUCH/MOBILE DEVICES)
      const tiltWrapper = document.getElementById('card-tilt-wrapper');
      const tiltEnabled = config.effects ? (config.effects.cardTilt3D !== false) : true;

      if (tiltEnabled && !isTouchDevice) {
        document.addEventListener('mousemove', (e) => {
          const rect = tiltWrapper.getBoundingClientRect();
          const cardX = rect.left + rect.width / 2;
          const cardY = rect.top + rect.height / 2;
          const deltaX = (e.clientX - cardX) / (window.innerWidth / 2);
          const deltaY = (e.clientY - cardY) / (window.innerHeight / 2);
          
          const rotateX = deltaY * -10;
          const rotateY = deltaX * 10;
          tiltWrapper.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
        });

        document.addEventListener('mouseleave', () => {
          tiltWrapper.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });
      }

      // 14. Canvas Particle Effects Engine (sparkles, snow, rain, matrix)
      const particleMode = (config.effects && config.effects.particleEffect) || "sparkles";
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      if (particleMode !== "none") {
        const particles = [];
        const count = particleMode === "matrix" ? 55 : (window.innerWidth < 480 ? 35 : 65);

        class Particle {
          constructor() {
            this.reset();
          }
          reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 1;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.speedY = Math.random() * 0.8 + 0.3;
            this.opacity = Math.random() * 0.7 + 0.2;
            this.fadeSpeed = Math.random() * 0.015 + 0.005;
            this.fadingIn = true;
            this.char = particleMode === "matrix" ? String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96)) : "";
          }
          update() {
            if (particleMode === "sparkles") {
              if (this.fadingIn) {
                this.opacity += this.fadeSpeed;
                if (this.opacity >= 0.9) this.fadingIn = false;
              } else {
                this.opacity -= this.fadeSpeed;
                if (this.opacity <= 0.05) this.reset();
              }
              this.y -= this.speedY * 0.4;
            } else if (particleMode === "snow") {
              this.y += this.speedY;
              this.x += Math.sin(this.y * 0.02) * 0.6;
              if (this.y > canvas.height) this.y = -10;
            } else if (particleMode === "rain") {
              this.y += this.speedY * 6;
              this.x += 1;
              if (this.y > canvas.height) this.y = -10;
            } else if (particleMode === "matrix") {
              this.y += this.speedY * 3;
              if (this.y > canvas.height) {
                this.y = -20;
                this.char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
              }
            }
          }
          draw() {
            ctx.save();
            if (particleMode === "sparkles") {
              ctx.fillStyle = `rgba(167, 139, 250, ${this.opacity})`;
              ctx.shadowColor = 'rgba(123, 92, 248, 0.8)';
              ctx.shadowBlur = 8;
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (particleMode === "snow") {
              ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (particleMode === "rain") {
              ctx.strokeStyle = `rgba(123, 92, 248, ${this.opacity * 0.7})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y);
              ctx.lineTo(this.x + 2, this.y + 12);
              ctx.stroke();
            } else if (particleMode === "matrix") {
              ctx.fillStyle = `rgba(16, 185, 129, ${this.opacity})`;
              ctx.font = '14px monospace';
              ctx.fillText(this.char, this.x, this.y);
            }
            ctx.restore();
          }
        }

        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.update();
            p.draw();
          });
          requestAnimationFrame(animate);
        }
        animate();
      }

    })();
  </script>
</body>
</html>
